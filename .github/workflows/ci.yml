name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build application
        run: dotnet build "Server Inventory.csproj" --configuration Release

      - name: Run tests
        run: dotnet test "Server Inventory.Tests/Server Inventory.Tests.csproj" --configuration Release

      - name: Build container image
        run: docker build --tag server-inventory:ci .
