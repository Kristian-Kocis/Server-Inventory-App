services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: servermanagement
      POSTGRES_USER: servermanagement
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servermanagement -d servermanagement"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Database__Provider: PostgreSQL
      ConnectionStrings__ServerInventory: Host=database;Port=5432;Database=servermanagement;Username=servermanagement;Password=${POSTGRES_PASSWORD}
      Authentication__Username: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      Authentication__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      Jwt__Issuer: ServerInventory
      Jwt__Audience: ServerInventory.Api
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Jwt__AccessTokenMinutes: 60
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
